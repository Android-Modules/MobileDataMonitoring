    return `&lt;div class=&quot;mg-row mg-wrap&quot; style=&quot;margin-bottom:14px&quot;&gt;${btn(&#x27;＋ 新建流量包&#x27;,&#x27;new&#x27;,&#x27;soft&#x27;)}${link(&#x27;识别规则库 →&#x27;,&#x27;rules&#x27;)}&lt;/div&gt;&lt;label class=&quot;mg-field&quot;&gt;流量类型&lt;select data-setting=&quot;filter&quot; aria-label=&quot;筛选流量类型&quot;&gt;&lt;option value=&quot;all&quot; ${state.filter===&#x27;all&#x27;?&#x27;selected&#x27;:&#x27;&#x27;}&gt;全部流量包&lt;/option&gt;&lt;option value=&quot;general&quot; ${state.filter===&#x27;general&#x27;?&#x27;selected&#x27;:&#x27;&#x27;}&gt;国内通用流量&lt;/option&gt;&lt;option value=&quot;directed&quot; ${state.filter===&#x27;directed&#x27;?&#x27;selected&#x27;:&#x27;&#x27;}&gt;定向流量&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;${state.sim===1?note(&#x27;卡 1 不参与测试，也不会被自动启用移动数据。&#x27;):&#x27;&#x27;}${list.length?list.map(p=&gt;`&lt;section class=&quot;mg-pack&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;mg-pack-title cursor-interaction&quot; data-edit=&quot;${esc(p.id)}&quot;&gt;&lt;div class=&quot;mg-row&quot;&gt;&lt;h3&gt;${esc(p.name)}&lt;/h3&gt;${icon(&#x27;chevron-right&#x27;,&#x27;mg-chev&#x27;)}&lt;/div&gt;&lt;/button&gt;&lt;div class=&quot;mg-row&quot;&gt;&lt;div class=&quot;mg-pack-total&quot;&gt;${p.total===null?&#x27;待核实&#x27;:Math.max(0,p.total-p.used).toFixed(2)+&#x27; GB&#x27;} &lt;small&gt;${p.total===null?&#x27;套餐额度&#x27;:&#x27;剩余&#x27;}&lt;/small&gt;&lt;/div&gt;${badge(p.kind===&#x27;general&#x27;?&#x27;通用&#x27;:p.total!==null&amp;&amp;p.used&gt;=p.total?&#x27;已用尽&#x27;:&#x27;待验证&#x27;,p.kind===&#x27;general&#x27;?&#x27;neutral&#x27;:p.total!==null&amp;&amp;p.used&gt;=p.total?&#x27;danger&#x27;:&#x27;warn&#x27;)}&lt;/div&gt;${p.total!==null?meter(p.used,p.total,p.name+&#x27;已用 GB&#x27;):&#x27;&#x27;}&lt;div class=&quot;mg-row mg-small&quot;&gt;&lt;span&gt;已用 ${p.used.toFixed(2)} GB · 示例&lt;/span&gt;&lt;span&gt;${p.total===null?&#x27;不视为无限量&#x27;:&#x27;总量 &#x27;+p.total+&#x27; GB&#x27;}&lt;/span&gt;&lt;/div&gt;${p.kind===&#x27;directed&#x27;?`&lt;div class=&quot;mg-chips&quot;&gt;${p.apps.map(a=&gt;`&lt;span class=&quot;mg-chip&quot;&gt;${esc(a)}&lt;/span&gt;`).join(&#x27;&#x27;)}${p.rules.length?`&lt;span class=&quot;mg-chip&quot;&gt;${p.rules.length} 条规则&lt;/span&gt;`:&#x27;&#x27;}${!p.apps.length&amp;&amp;!p.rules.length?&#x27;&lt;span class=&quot;mg-chip&quot;&gt;未绑定应用或规则&lt;/span&gt;&#x27;:&#x27;&#x27;}&lt;/div&gt;`:&#x27;&#x27;}&lt;/section&gt;`).join(&#x27;&#x27;):`&lt;div class=&quot;mg-panel mg-empty&quot;&gt;&lt;h2&gt;还没有流量包&lt;/h2&gt;&lt;p class=&quot;mg-note&quot;&gt;为这张卡设置通用额度或定向流量包&lt;/p&gt;&lt;/div&gt;`}`;
  }
  function edit() {
    if(!draft) draft={scope:&#x27;single&#x27;,poolKey:&#x27;&#x27;,accountAlias:&#x27;&#x27;,members:1,...JSON.parse(JSON.stringify(state.packages.find(p=&gt;p.id===state.editorId)||{id:null,sim:state.sim,name:&#x27;&#x27;,kind:&#x27;directed&#x27;,total:null,used:0,apps:[],rules:[],mode:&#x27;any&#x27;,priority:50,period:&#x27;monthly&#x27;}))};
    return `&lt;form id=&quot;mg-pack-form&quot;&gt;&lt;div class=&quot;mg-panel&quot;&gt;&lt;label class=&quot;mg-field&quot;&gt;流量包名称&lt;input name=&quot;name&quot; required maxlength=&quot;40&quot; value=&quot;${esc(draft.name)}&quot; placeholder=&quot;例如：移动云盘定向&quot;&gt;&lt;/label&gt;&lt;div class=&quot;mg-fields&quot;&gt;&lt;label class=&quot;mg-field&quot;&gt;流量类型&lt;select name=&quot;kind&quot;&gt;&lt;option value=&quot;general&quot; ${draft.kind===&#x27;general&#x27;?&#x27;selected&#x27;:&#x27;&#x27;}&gt;国内通用&lt;/option&gt;&lt;option value=&quot;directed&quot; ${draft.kind===&#x27;directed&#x27;?&#x27;selected&#x27;:&#x27;&#x27;}&gt;定向流量&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;&lt;label class=&quot;mg-field&quot;&gt;总额度 / GB&lt;input name=&quot;total&quot; type=&quot;number&quot; min=&quot;0.001&quot; step=&quot;0.001&quot; value=&quot;${draft.total??&#x27;&#x27;}&quot; placeholder=&quot;未知可留空&quot;&gt;&lt;/label&gt;&lt;/div&gt;&lt;div class=&quot;mg-fields&quot;&gt;&lt;label class=&quot;mg-field&quot;&gt;当前已用 / GB&lt;input name=&quot;used&quot; type=&quot;number&quot; min=&quot;0&quot; step=&quot;0.001&quot; required value=&quot;${draft.used}&quot;&gt;&lt;/label&gt;&lt;label class=&quot;mg-field&quot;&gt;重置周期&lt;select name=&quot;period&quot;&gt;&lt;option value=&quot;monthly&quot; ${draft.period===&#x27;monthly&#x27;?&#x27;selected&#x27;:&#x27;&#x27;}&gt;按卡片账期&lt;/option&gt;&lt;option value=&quot;fixed&quot; ${draft.period===&#x27;fixed&#x27;?&#x27;selected&#x27;:&#x27;&#x27;}&gt;不自动重置&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;mg-panel&quot;&gt;&lt;label class=&quot;mg-field&quot;&gt;额度归属&lt;select name=&quot;scope&quot;&gt;&lt;option value=&quot;single&quot; ${draft.scope===&#x27;single&#x27;?&#x27;selected&#x27;:&#x27;&#x27;}&gt;本卡独享&lt;/option&gt;&lt;option value=&quot;shared&quot; ${draft.scope===&#x27;shared&#x27;?&#x27;selected&#x27;:&#x27;&#x27;}&gt;账户共享额度池&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;&lt;label class=&quot;mg-field&quot;&gt;所属账号备注&lt;input name=&quot;accountAlias&quot; maxlength=&quot;30&quot; value=&quot;${esc(draft.accountAlias)}&quot; placeholder=&quot;例如：联通主账号 A&quot;&gt;&lt;/label&gt;&lt;div class=&quot;mg-fields&quot;&gt;&lt;label class=&quot;mg-field&quot;&gt;共享池标识&lt;input name=&quot;poolKey&quot; maxlength=&quot;40&quot; value=&quot;${esc(draft.poolKey)}&quot; placeholder=&quot;共享时必填&quot;&gt;&lt;/label&gt;&lt;label class=&quot;mg-field&quot;&gt;账户成员数量&lt;input name=&quot;members&quot; type=&quot;number&quot; min=&quot;1&quot; max=&quot;99&quot; value=&quot;${draft.members}&quot;&gt;&lt;/label&gt;&lt;/div&gt;&lt;p class=&quot;mg-note&quot;&gt;共享池在账号下只保留一份额度。账号成员不等于手机卡槽；校准时分别保留共享总用量和本卡用量。&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;mg-section&quot;&gt;&lt;h2&gt;绑定应用 · 可多选&lt;/h2&gt;&lt;p class=&quot;mg-note&quot;&gt;应用归类用于估算；第三方内容可能仍扣通用流量。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;mg-panel&quot;&gt;${apps.map(a=&gt;`&lt;label class=&quot;mg-choice&quot;&gt;&lt;input type=&quot;checkbox&quot; name=&quot;apps&quot; value=&quot;${a}&quot; ${draft.apps.includes(a)?&#x27;checked&#x27;:&#x27;&#x27;}&gt;&lt;span&gt;${a}&lt;/span&gt;&lt;/label&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;
    &lt;div class=&quot;mg-section mg-row&quot;&gt;&lt;h2&gt;绑定识别规则 · 可多选&lt;/h2&gt;&lt;/div&gt;&lt;div class=&quot;mg-panel&quot;&gt;${ruleSeeds.map(r=&gt;`&lt;label class=&quot;mg-choice&quot;&gt;&lt;input type=&quot;checkbox&quot; name=&quot;rules&quot; value=&quot;${r.id}&quot; ${draft.rules.includes(r.id)?&#x27;checked&#x27;:&#x27;&#x27;}&gt;&lt;span&gt;${r.name}&lt;small&gt;${r.host} · 待验证&lt;/small&gt;&lt;/span&gt;&lt;/label&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;
    &lt;div class=&quot;mg-panel&quot;&gt;&lt;label class=&quot;mg-field&quot;&gt;匹配方式&lt;select name=&quot;mode&quot;&gt;&lt;option value=&quot;any&quot; ${draft.mode===&#x27;any&#x27;?&#x27;selected&#x27;:&#x27;&#x27;}&gt;任一应用或任一规则命中&lt;/option&gt;&lt;option value=&quot;both&quot; ${draft.mode===&#x27;both&#x27;?&#x27;selected&#x27;:&#x27;&#x27;}&gt;应用命中，且任一规则命中&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;&lt;label class=&quot;mg-field&quot;&gt;归属优先级 · 数字越小越优先&lt;input name=&quot;priority&quot; type=&quot;number&quot; required min=&quot;1&quot; max=&quot;1000&quot; value=&quot;${draft.priority}&quot;&gt;&lt;/label&gt;&lt;p class=&quot;mg-note&quot;&gt;同一笔流量只归属一个包。耗尽或额度未核实的包，不抵扣通用保护预算。&lt;/p&gt;&lt;/div&gt;&lt;p class=&quot;mg-error&quot; id=&quot;mg-form-error&quot; role=&quot;alert&quot; hidden&gt;&lt;/p&gt;&lt;button class=&quot;mg-button primary wide cursor-interaction&quot; type=&quot;submit&quot;&gt;保存流量包&lt;/button&gt;&lt;/form&gt;`;
  }
  function rules() { return `${note(&#x27;当前 5 组仅为候选规则。湖北配置在江苏套餐上的扣费归属尚未验证。&#x27;)}&lt;div class=&quot;mg-row mg-wrap&quot; style=&quot;margin-bottom:16px&quot;&gt;${btn(state.rulesImported?&#x27;查看导入结果&#x27;:&#x27;分析两份 .conf&#x27;,&#x27;import&#x27;,&#x27;soft&#x27;)}${link(&#x27;去验证规则 →&#x27;,&#x27;test&#x27;)}&lt;/div&gt;&lt;div class=&quot;mg-panel&quot;&gt;${ruleSeeds.map(r=&gt;`&lt;button type=&quot;button&quot; class=&quot;mg-item cursor-interaction&quot; data-rule=&quot;${r.id}&quot;&gt;&lt;div class=&quot;mg-item-text&quot;&gt;&lt;div class=&quot;mg-item-name&quot;&gt;${r.name}&lt;/div&gt;&lt;span class=&quot;mg-rule-domain&quot;&gt;${r.host}&lt;/span&gt;&lt;div class=&quot;mg-small&quot;&gt;${r.source}&lt;/div&gt;&lt;/div&gt;${badge(&#x27;待验证&#x27;,&#x27;warn&#x27;)}${icon(&#x27;chevron-right&#x27;,&#x27;mg-chev&#x27;)}&lt;/button&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;&lt;p class=&quot;mg-note&quot;&gt;只识别实际可见的字段。无法读取 HTTPS 路径时，保持待识别，不扩大为整个域名。&lt;/p&gt;`; }
  function rule() {
    const r=ruleSeeds.find(r=&gt;r.id===state.ruleId)||ruleSeeds[0];
    return `&lt;div class=&quot;mg-panel&quot;&gt;&lt;div class=&quot;mg-row&quot;&gt;&lt;h2 style=&quot;font-size:18px&quot;&gt;${r.name}&lt;/h2&gt;${badge(&#x27;待验证&#x27;,&#x27;warn&#x27;)}&lt;/div&gt;&lt;div class=&quot;mg-divider&quot;&gt;&lt;/div&gt;&lt;p class=&quot;mg-label&quot;&gt;域名 · 精确匹配&lt;/p&gt;&lt;span class=&quot;mg-rule-domain&quot;&gt;${r.host}&lt;/span&gt;&lt;p class=&quot;mg-label&quot; style=&quot;margin-top:16px&quot;&gt;路径范围 · 从样例提取&lt;/p&gt;&lt;span class=&quot;mg-rule-domain&quot;&gt;${r.path}&lt;/span&gt;&lt;p class=&quot;mg-note&quot;&gt;仅路径前缀不足以证明免流；原始配置使用具体下载 URL，路径扩展仍需逐条验证。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;mg-panel&quot;&gt;&lt;div class=&quot;mg-row&quot;&gt;&lt;span&gt;适用运营商 / 地区&lt;/span&gt;&lt;span class=&quot;mg-small&quot;&gt;待官方验证&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;mg-divider&quot;&gt;&lt;/div&gt;&lt;div class=&quot;mg-row&quot;&gt;&lt;span&gt;证据来源&lt;/span&gt;&lt;span class=&quot;mg-small&quot;&gt;湖北测速配置&lt;/span&gt;&lt;/div&gt;&lt;p class=&quot;mg-note&quot;&gt;未保留样例 URL 中的账号、密钥或时效参数。&lt;/p&gt;&lt;/div&gt;${btn(&#x27;模拟匹配 10 MB 样例&#x27;,&#x27;sample&#x27;,&#x27;soft wide&#x27;)}&lt;div id=&quot;mg-rule-result&quot; class=&quot;mg-rule-result&quot; hidden role=&quot;status&quot;&gt;&lt;/div&gt;&lt;div class=&quot;mg-actions&quot;&gt;${btn(&#x27;返回规则库&#x27;,&#x27;rules&#x27;)}${btn(&#x27;验证扣费归属&#x27;,&#x27;test&#x27;,&#x27;primary&#x27;)}&lt;/div&gt;`;
  }
  function imported() { return `&lt;div class=&quot;mg-panel&quot;&gt;&lt;div class=&quot;mg-row&quot;&gt;&lt;h2 style=&quot;font-size:17px&quot;&gt;配置分析结果&lt;/h2&gt;${badge(&#x27;内容一致&#x27;,&#x27;neutral&#x27;)}&lt;/div&gt;&lt;p class=&quot;mg-note&quot;&gt;湖北移动定向配置20260801.conf&lt;br&gt;及带 20261031_203910 时间戳的副本&lt;/p&gt;&lt;div class=&quot;mg-divider&quot;&gt;&lt;/div&gt;&lt;div class=&quot;mg-row&quot;&gt;&lt;span&gt;输入文件&lt;/span&gt;&lt;strong&gt;2 份&lt;/strong&gt;&lt;/div&gt;&lt;div class=&quot;mg-row&quot; style=&quot;margin-top:10px&quot;&gt;&lt;span&gt;合并后候选规则&lt;/span&gt;&lt;strong&gt;5 组&lt;/strong&gt;&lt;/div&gt;&lt;div class=&quot;mg-row&quot; style=&quot;margin-top:10px&quot;&gt;&lt;span&gt;重复副本&lt;/span&gt;&lt;strong&gt;1 份 · 已忽略&lt;/strong&gt;&lt;/div&gt;&lt;/div&gt;${note(&#x27;这是 HBCS_SPEED_TEST_CONFIG v2 测速配置，包含下载资源，不包含运营商余量接口或套餐额度。&#x27;)}&lt;div class=&quot;mg-panel&quot;&gt;${ruleSeeds.map(r=&gt;`&lt;div class=&quot;mg-row&quot; style=&quot;padding:8px 0&quot;&gt;&lt;span&gt;${r.name}&lt;/span&gt;${badge(&#x27;待验证&#x27;,&#x27;warn&#x27;)}&lt;/div&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;${btn(state.rulesImported?&#x27;查看规则库&#x27;:&#x27;保存为候选规则&#x27;,&#x27;confirm-import&#x27;,&#x27;primary wide&#x27;)}`; }
  function correction() {
    const cfg=settings(),adjustment=cfg.correction,manual=cfg.manualCorrection;
    const calibratedPack=state.packages.find(p=&gt;p.id===adjustment?.pack);
    const manualPack=state.packages.find(p=&gt;p.id===manual?.pack);
    return `${state.sim===1?note(&#x27;卡 1 可配置官方查询；测试仍不会使用这张卡。&#x27;):&#x27;&#x27;}&lt;div class=&quot;mg-panel&quot;&gt;&lt;div class=&quot;mg-row&quot;&gt;&lt;div&gt;&lt;h2 style=&quot;font-size:17px&quot;&gt;官方流量查询&lt;/h2&gt;&lt;p class=&quot;mg-note&quot; style=&quot;margin-top:5px&quot;&gt;按卡分别绑定运营商账号&lt;/p&gt;&lt;/div&gt;${badge(&#x27;未接入&#x27;,&#x27;neutral&#x27;)}&lt;/div&gt;&lt;div class=&quot;mg-divider&quot;&gt;&lt;/div&gt;&lt;label class=&quot;mg-field&quot;&gt;运营商适配器&lt;select data-setting=&quot;adapter&quot;&gt;${[&#x27;待选择&#x27;,&#x27;中国移动 · 江苏&#x27;,&#x27;中国联通&#x27;].map(v=&gt;`&lt;option ${cfg.adapter===v?&#x27;selected&#x27;:&#x27;&#x27;}&gt;${v}&lt;/option&gt;`).join(&#x27;&#x27;)}&lt;/select&gt;&lt;/label&gt;${btn(&#x27;连接查询接口&#x27;,&#x27;capture&#x27;,&#x27;soft wide&#x27;)}&lt;p class=&quot;mg-note&quot;&gt;接口将在手机抓包后适配，当前没有真实请求。&lt;/p&gt;&lt;/div&gt;
    ${cfg.adapter===&#x27;中国联通&#x27;?`&lt;div class=&quot;mg-panel&quot;&gt;&lt;h3 style=&quot;font-size:15px&quot;&gt;联通账户与共享套餐&lt;/h3&gt;&lt;div class=&quot;mg-chips&quot;&gt;${badge(&#x27;通用流量&#x27;,&#x27;neutral&#x27;)}${badge(&#x27;专属流量&#x27;,&#x27;neutral&#x27;)}${badge(&#x27;共享 / 独享&#x27;,&#x27;neutral&#x27;)}&lt;/div&gt;&lt;p class=&quot;mg-note&quot;&gt;绑定登录账号后，分别映射每个官方包。共享池总用量与本卡用量分开，汇总与子包不重复相加。&lt;/p&gt;&lt;div class=&quot;mg-divider&quot;&gt;&lt;/div&gt;&lt;div class=&quot;mg-row&quot;&gt;&lt;span&gt;账号与本卡关系&lt;/span&gt;${badge(&#x27;待确认&#x27;,&#x27;warn&#x27;)}&lt;/div&gt;&lt;p class=&quot;mg-note&quot;&gt;在卡 2 网络上查询联通账号，不代表该账号属于卡 2。&lt;/p&gt;&lt;/div&gt;`:&#x27;&#x27;}
    &lt;div class=&quot;mg-panel&quot;&gt;&lt;h3 style=&quot;font-size:15px&quot;&gt;自动校准计划&lt;/h3&gt;&lt;div class=&quot;mg-divider&quot;&gt;&lt;/div&gt;&lt;label class=&quot;mg-field&quot;&gt;查询频率&lt;select data-setting=&quot;interval&quot;&gt;${[[&#x27;6&#x27;,&#x27;每 6 小时&#x27;],[&#x27;12&#x27;,&#x27;每 12 小时&#x27;],[&#x27;24&#x27;,&#x27;每天一次&#x27;],[&#x27;0&#x27;,&#x27;仅手动查询&#x27;]].map(([v,t])=&gt;`&lt;option value=&quot;${v}&quot; ${cfg.interval===v?&#x27;selected&#x27;:&#x27;&#x27;}&gt;${t}&lt;/option&gt;`).join(&#x27;&#x27;)}&lt;/select&gt;&lt;/label&gt;&lt;p class=&quot;mg-note&quot;&gt;连接成功后启用。登录失效、验证码或接口限频时，提示处理并暂停自动查询。&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;mg-section mg-row&quot;&gt;&lt;h2&gt;校准记录&lt;/h2&gt;${link(&#x27;手动校准 →&#x27;,&#x27;manual&#x27;)}&lt;/div&gt;
    ${adjustment?`&lt;div class=&quot;mg-panel&quot;&gt;&lt;div class=&quot;mg-row&quot;&gt;&lt;span&gt;${esc(calibratedPack?.name||&#x27;流量包&#x27;)}&lt;/span&gt;${badge(&#x27;已校准 · 示例&#x27;)}&lt;/div&gt;&lt;p class=&quot;mg-note&quot;&gt;校准前 ${adjustment.from.toFixed(2)} GB → 校准后 ${adjustment.to.toFixed(2)} GB&lt;/p&gt;&lt;div class=&quot;mg-divider&quot;&gt;&lt;/div&gt;&lt;p class=&quot;mg-small&quot;&gt;保留原始计数与校准差额；不重复累加。&lt;/p&gt;&lt;/div&gt;`:&#x27;&#x27;}
    ${manual?`&lt;div class=&quot;mg-panel&quot;&gt;&lt;div class=&quot;mg-row&quot;&gt;&lt;span&gt;${esc(manualPack?.name||&#x27;流量包&#x27;)}&lt;/span&gt;${badge(&#x27;快照已保存&#x27;,&#x27;neutral&#x27;)}&lt;/div&gt;&lt;p class=&quot;mg-note&quot;&gt;官方已用 ${manual.used.toFixed(3)} GB&lt;br&gt;截至 ${esc(manual.asof.replace(&#x27;T&#x27;,&#x27; &#x27;))}&lt;/p&gt;&lt;p class=&quot;mg-note&quot;&gt;待本地时间对应计数接入，尚未改变保护基准。&lt;/p&gt;&lt;/div&gt;`:&#x27;&#x27;}
    ${!adjustment&amp;&amp;!manual?&#x27;&lt;div class=&quot;mg-panel mg-empty&quot;&gt;&lt;p&gt;还没有校准记录&lt;/p&gt;&lt;p class=&quot;mg-note&quot;&gt;连接官方查询，或先填写官方已用量&lt;/p&gt;&lt;/div&gt;&#x27;:&#x27;&#x27;}
    ${packs().some(p=&gt;p.kind===&#x27;general&#x27;)?btn(&#x27;预览官方差额校准&#x27;,&#x27;demo-correction&#x27;,&#x27;wide&#x27;):&#x27;&#x27;}`;

  function protection() { if(state.sim===1) return card1Empty(); return `&lt;div class=&quot;mg-panel&quot;&gt;&lt;h3 style=&quot;font-size:16px&quot;&gt;额度不足时&lt;/h3&gt;&lt;label class=&quot;mg-choice&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;policy&quot; value=&quot;stop&quot; ${state.policy===&#x27;stop&#x27;?&#x27;checked&#x27;:&#x27;&#x27;}&gt;&lt;span&gt;停止移动数据&lt;small&gt;达到保护线后停用当前卡数据&lt;/small&gt;&lt;/span&gt;&lt;/label&gt;&lt;label class=&quot;mg-choice&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;policy&quot; value=&quot;switch&quot; ${state.policy===&#x27;switch&#x27;?&#x27;checked&#x27;:&#x27;&#x27;}&gt;&lt;span&gt;自动切换有余量的卡&lt;small&gt;先确认目标卡额度、信号和允许用卡状态&lt;/small&gt;&lt;/span&gt;&lt;/label&gt;&lt;label class=&quot;mg-choice&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;policy&quot; value=&quot;fixed&quot; ${state.policy===&#x27;fixed&#x27;?&#x27;checked&#x27;:&#x27;&#x27;}&gt;&lt;span&gt;固定使用卡 2&lt;small&gt;阻止自动切卡；卡 2 达保护线后停止数据&lt;/small&gt;&lt;/span&gt;&lt;/label&gt;&lt;/div&gt;

  function appStats() { return `${note(&#x27;应用统计是分类估算。匹配到多个包时按优先级归属，不重复计费。&#x27;)}&lt;div class=&quot;mg-panel&quot;&gt;${(state.sim===2?[[&#x27;跑满了吗&#x27;,&#x27;312 MB&#x27;,&#x27;候选规则命中 · 待验证&#x27;],[&#x27;咪咕快游&#x27;,&#x27;286 MB&#x27;,&#x27;定向包已用尽 · 计入通用&#x27;],[&#x27;移动云盘&#x27;,&#x27;128 MB&#x27;,&#x27;额度未知 · 计入保护预算&#x27;],[&#x27;其他应用&#x27;,&#x27;100 MB&#x27;,&#x27;通用 / 未识别&#x27;]]:[]).map(([a,v,d])=&gt;`&lt;div class=&quot;mg-item&quot;&gt;&lt;div class=&quot;mg-app-icon neutral&quot;&gt;${a.slice(0,1)}&lt;/div&gt;&lt;div class=&quot;mg-item-text&quot;&gt;&lt;div class=&quot;mg-item-name&quot;&gt;${a}&lt;/div&gt;&lt;div class=&quot;mg-small&quot;&gt;${d}&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;mg-value&quot;&gt;${v}&lt;/div&gt;&lt;/div&gt;`).join(&#x27;&#x27;)||&#x27;&lt;p class=&quot;mg-small&quot;&gt;卡 1 暂无用量记录&lt;/p&gt;&#x27;}&lt;/div&gt;&lt;p class=&quot;mg-note&quot;&gt;统计范围：当前卡 · 今日 · 接收 + 发送。Wi-Fi 不计入。&lt;/p&gt;`; }
  function card() { const cfg=settings();return `&lt;form id=&quot;mg-card-form&quot;&gt;&lt;div class=&quot;mg-panel&quot;&gt;&lt;h2 style=&quot;font-size:16px&quot;&gt;卡 ${state.sim}&lt;/h2&gt;&lt;label class=&quot;mg-field&quot; style=&quot;margin-top:16px&quot;&gt;卡片备注&lt;input name=&quot;alias&quot; maxlength=&quot;30&quot; value=&quot;${esc(cfg.alias)}&quot;&gt;&lt;/label&gt;&lt;label class=&quot;mg-field&quot;&gt;每月账期起始日&lt;select name=&quot;cycle&quot;&gt;${Array.from({length:31},(_,i)=&gt;`&lt;option value=&quot;${i+1}&quot; ${cfg.cycle===i+1?&#x27;selected&#x27;:&#x27;&#x27;}&gt;每月 ${i+1} 日&lt;/option&gt;`).join(&#x27;&#x27;)}&lt;/select&gt;&lt;/label&gt;&lt;label class=&quot;mg-field&quot;&gt;运营商计量单位&lt;select name=&quot;unit&quot;&gt;&lt;option value=&quot;decimal&quot; ${cfg.unit!==&#x27;binary&#x27;?&#x27;selected&#x27;:&#x27;&#x27;}&gt;1 GB = 1000 MB&lt;/option&gt;&lt;option value=&quot;binary&quot; ${cfg.unit===&#x27;binary&#x27;?&#x27;selected&#x27;:&#x27;&#x27;}&gt;1 GB = 1024 MB&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;&lt;p class=&quot;mg-note&quot;&gt;当月没有对应日期时，按当月最后一天计算。&lt;/p&gt;&lt;/div&gt;${note(&#x27;运营商和卡槽的对应关系尚待确认。正式模块换卡后会重新校验身份，避免把旧卡套餐套给新卡。&#x27;)}&lt;button type=&quot;submit&quot; class=&quot;mg-button primary wide cursor-interaction&quot;&gt;保存卡片设置&lt;/button&gt;&lt;/form&gt;`; }

    if(a===&#x27;demo-correction&#x27;) {if(settings().correction){toast(&#x27;这个示例已校准，不会重复叠加差额&#x27;);return;}const p=packs().find(p=&gt;p.kind===&#x27;general&#x27;);if(!p)return;settings().correction={pack:p.id,from:p.used,to:p.used+0.36,delta:0.36};render();persist();toast(&#x27;示例校准：+0.36 GB，原始计数保持不变&#x27;);return;}
