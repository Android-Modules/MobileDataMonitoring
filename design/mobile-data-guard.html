<style>

  #mobile-data-guard .mg-item:first-child { padding-top:0; }

  #mobile-data-guard .mg-item-text .mg-small { margin-top:3px; }
  #mobile-data-guard .mg-app-icon { display:flex; align-items:center; justify-content:center; background:var(--mg-soft); color:var(--mg-accent); border-radius:13px; width:40px; height:40px; flex-shrink:0; font-weight:600; font-size:16px; }
  #mobile-data-guard .mg-app-icon.neutral { color:var(--mg-secondary); background:var(--mg-bg); }
  #mobile-data-guard .mg-value { text-align:right; font-variant-numeric:tabular-nums; font-size:14px; white-space:nowrap; }
  #mobile-data-guard .mg-value small { display:block; font-size:11px; color:var(--mg-secondary); margin-top:3px; }
  #mobile-data-guard .mg-chev { color:var(--mg-secondary); width:16px; height:16px; flex-shrink:0; }
  #mobile-data-guard .mg-button { display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:44px; padding:10px 16px; border:1px solid var(--mg-line); border-radius:13px; background:var(--mg-surface); font-weight:550; font-size:13px; }
  #mobile-data-guard .mg-button.primary { color:var(--mg-surface); background:var(--mg-accent); border-color:var(--mg-accent); }
  #mobile-data-guard .mg-button.wide { width:100%; }
  #mobile-data-guard .mg-button.soft { background:var(--mg-soft); border-color:transparent; color:var(--mg-accent); }
  #mobile-data-guard .mg-actions { display:flex; gap:10px; margin-top:16px; flex-wrap:wrap; }
  #mobile-data-guard .mg-actions > * { flex:1; }
  #mobile-data-guard .mg-pack { padding:18px; background:var(--mg-surface); border-radius:var(--mg-radius); margin-bottom:12px; }
  #mobile-data-guard .mg-pack-title { display:block; width:100%; }
  #mobile-data-guard .mg-pack h3 { font-size:15px; font-weight:600; }
  #mobile-data-guard .mg-pack-total { font-size:23px; font-weight:600; margin-top:15px; font-variant-numeric:tabular-nums; }
  #mobile-data-guard .mg-pack-total small { font-size:12px; color:var(--mg-secondary); font-weight:400; }
  #mobile-data-guard .mg-chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:13px; }
  #mobile-data-guard .mg-chip { border-radius:7px; background:var(--mg-bg); font-size:11px; color:var(--mg-secondary); padding:4px 7px; overflow-wrap:anywhere; }
  #mobile-data-guard .mg-nav { border-top:1px solid var(--mg-line); display:grid; grid-template-columns:repeat(4,1fr); background:var(--mg-surface); padding:8px 12px 4px; }
  #mobile-data-guard .mg-nav button { display:flex; flex-direction:column; gap:4px; align-items:center; padding:8px 3px; font-size:11px; color:var(--mg-secondary); border-radius:15px; }
  #mobile-data-guard .mg-nav button[aria-current="page"] { color:var(--mg-accent); background:var(--mg-soft); }
  #mobile-data-guard .mg-home-line { width:96px; height:4px; background:var(--mg-text); opacity:.18; border-radius:9px; margin:9px auto; }
  #mobile-data-guard .mg-field { display:block; margin-bottom:16px; font-size:12px; color:var(--mg-secondary); }
  #mobile-data-guard .mg-field:last-child { margin-bottom:0; }
  #mobile-data-guard .mg-field input,#mobile-data-guard .mg-field select { display:block; width:100%; min-height:44px; border:1px solid var(--mg-line); border-radius:12px; background:var(--mg-bg); color:var(--mg-text); padding:10px 12px; margin-top:7px; font-size:14px; }
  #mobile-data-guard .mg-fields { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  #mobile-data-guard .mg-choice { display:flex; align-items:center; gap:11px; min-height:50px; padding:9px 0; border-bottom:1px solid var(--mg-line); }
  #mobile-data-guard .mg-choice:last-child { border-bottom:0; }
  #mobile-data-guard .mg-choice input { width:18px; height:18px; accent-color:var(--mg-accent); flex-shrink:0; }
  #mobile-data-guard .mg-choice span { flex:1; }
  #mobile-data-guard .mg-choice small { display:block; font-size:11px; color:var(--mg-secondary); margin-top:2px; overflow-wrap:anywhere; }
  #mobile-data-guard .mg-choice input[role="switch"] { appearance:none; width:38px; height:22px; border-radius:20px; background:var(--mg-secondary); padding:3px; margin:0; }
  #mobile-data-guard .mg-choice input[role="switch"]:checked { background:var(--mg-accent); }
  #mobile-data-guard .mg-choice input[role="switch"]:before { content:""; display:block; width:16px; height:16px; border-radius:50%; background:var(--mg-surface); }
  #mobile-data-guard .mg-choice input[role="switch"]:checked:before { transform:translateX(16px); }
  #mobile-data-guard .mg-flow { display:flex; gap:12px; padding:12px 0; }
  #mobile-data-guard .mg-flow-mark { width:25px; height:25px; flex-shrink:0; border-radius:50%; background:var(--mg-soft); color:var(--mg-accent); text-align:center; font-size:12px; line-height:25px; }
  #mobile-data-guard .mg-flow-text { flex:1; min-width:0; }
  #mobile-data-guard .mg-flow-text strong { font-size:13px; font-weight:550; }
  #mobile-data-guard .mg-flow-text p { font-size:12px; color:var(--mg-secondary); margin-top:3px; }
  #mobile-data-guard .mg-divider { height:1px; background:var(--mg-line); margin:15px 0; }
  #mobile-data-guard .mg-error { color:var(--mg-red); font-size:12px; margin:10px 0; }
  #mobile-data-guard .mg-empty { text-align:center; padding:32px 10px 22px; }
  #mobile-data-guard .mg-empty .mg-icon { width:32px; height:32px; color:var(--mg-secondary); margin-bottom:12px; }
  #mobile-data-guard .mg-message { position:absolute; z-index:5; bottom:90px; left:18px; right:18px; border:1px solid var(--mg-line); border-radius:15px; background:var(--mg-text); color:var(--mg-bg); padding:13px 16px; font-size:13px; box-shadow:0 4px 20px #0002; }
  #mobile-data-guard .mg-rule-domain { display:block; color:var(--mg-secondary); font-size:12px; overflow-wrap:anywhere; margin-top:5px; }
  #mobile-data-guard .mg-rule-result { margin:15px 0 0; padding:13px; border-radius:13px; background:var(--mg-soft); font-size:12px; }
  @media(max-width:380px) { #mobile-data-guard {padding:8px 0;} #mobile-data-guard .mg-phone{border-radius:22px;} #mobile-data-guard .mg-main{padding:0 15px 18px;} #mobile-data-guard .mg-sims{padding:0 15px 15px;} #mobile-data-guard .mg-header{padding:18px 15px;} #mobile-data-guard .mg-preview{padding:12px 15px 0;} #mobile-data-guard .mg-hero{padding:18px;} #mobile-data-guard .mg-sim{padding:10px;} #mobile-data-guard .mg-big{font-size:44px;} #mobile-data-guard .mg-fields{grid-template-columns:1fr;} #mobile-data-guard .mg-actions{flex-direction:column;} #mobile-data-guard .mg-field input,#mobile-data-guard .mg-field select{font-size:16px;} }
</style>
<script>
(() => {
  const root = document.getElementById('mobile-data-guard');
  const $ = s => root.querySelector(s);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const icon = (name, cls='mg-icon') => `<i data-lucide="${name}" class="${cls}" aria-hidden="true"></i>`;
  const btn = (text, action, style='') => `<button type="button" class="mg-button cursor-interaction ${style}" data-action="${action}">${text}</button>`;
  const link = (text, action) => `<button type="button" class="mg-link cursor-interaction" data-action="${action}">${text}</button>`;
  const badge = (text, style='') => `<span class="mg-badge ${style}">${text}</span>`;
  const note = text => `<div class="mg-inline-note">${icon('info')}<span>${text}</span></div>`;
  const meter = (used, total, label) => `<div class="mg-meter ${used>=total?'is-empty':''}" role="meter" aria-label="${esc(label)}" aria-valuemin="0" aria-valuemax="${total}" aria-valuenow="${Math.min(used,total)}"><span style="width:${Math.min(100,used/total*100)}%"></span></div>`;
  const apps = ['移动云盘','咪咕快游','咪咕阅读','移动云手机','移动云电脑','跑满了吗'];
  const ruleSeeds = [
    {id:'cloud',name:'云手机',host:'cloud.139.com',path:'/cloudimage/app/58800/',source:'湖北配置 · 下载资源'},
    {id:'read',name:'咪咕悦读',host:'cdn3.cmread.com',path:'/operation/terminal/',source:'湖北配置 · 下载资源'},
    {id:'game',name:'咪咕快游',host:'gcache.migu.cn',path:'/prod/upload/game_resource/',source:'湖北配置 · 下载资源'},
    {id:'music',name:'咪咕音乐',host:'freetyst.nf.migu.cn',path:'/public/',source:'湖北配置 · 下载资源'},
    {id:'school',name:'中移网大定向',host:'wangda.chinamobile.com',path:'/default/',source:'湖北配置 · 下载资源'}
  ];
  const cardDefaults = sim => ({alias:'卡 '+sim,cycle:1,unit:'decimal',adapter:'待选择',interval:'6',correction:null,manualCorrection:null});
  const defaults = () => ({view:'overview',sim:2,filter:'all',rulesImported:false,editorId:null,ruleId:'game',cards:{1:cardDefaults(1),2:cardDefaults(2)},policy:'fixed',reserve:500,testLimit:1000,testProgress:0,testState:'idle',testProfile:'game',packages:[
    {id:'general',sim:2,name:'国内通用流量',kind:'general',total:30,used:23.20,apps:[],rules:[],mode:'any',priority:100,period:'monthly'},
    {id:'drive',sim:2,name:'移动云盘定向',kind:'directed',total:null,used:0,apps:['移动云盘'],rules:[],mode:'any',priority:10,period:'monthly'},
    {id:'gamepack',sim:2,name:'咪咕快游 50 GB',kind:'directed',total:50,used:50,apps:['咪咕快游'],rules:['game'],mode:'any',priority:20,period:'monthly'},
    {id:'desktop',sim:2,name:'移动云电脑 30 GB',kind:'directed',total:30,used:0,apps:['移动云电脑'],rules:[],mode:'any',priority:30,period:'monthly'},
    {id:'family',sim:2,name:'全家享定向 70 GB',kind:'directed',total:70,used:0,apps:[],rules:[],mode:'any',priority:40,period:'monthly'}
  ]});
  let state=defaults();
  let draft=null, messageTimer, intervalId;
  const sessionId=Date.now().toString(36)+Math.random().toString(36).slice(2);
  const validViews=['overview','packages','correction','protection','edit','rules','rule','apps','import','capture','manual','test','card','diagnostics'];
  function restore(saved) {
    const next=saved?.privateContent?.mobileDataGuard;
    if (!next || next.schema!==1) return;
    state={...defaults(),...next.state};
    state.cards={1:{...cardDefaults(1),...next.state.cards?.[1]},2:{...cardDefaults(2),...next.state.cards?.[2]}};
    if(!validViews.includes(state.view)||state.view==='edit') state.view='overview';
    if(![1,2].includes(state.sim)) state.sim=2;
    state.testState='idle';
  }
  restore(window.openai?.widgetState);
  function persist() {
    const snapshot={...state,testState:'idle'};
    window.openai?.setWidgetState?.({modelContent:{prototype:'流量守卫',selectedSim:state.sim,view:state.view,protection:state.policy,card1DataAllowed:false,testLimitMB:state.testLimit},privateContent:{mobileDataGuard:{schema:1,source:sessionId,state:snapshot}}})?.catch(()=>{});
  }
  window.addEventListener('openai:set_globals', e=>{const saved=e.detail?.globals?.widgetState;if(saved?.privateContent?.mobileDataGuard?.source===sessionId)return;if(saved){clearInterval(intervalId);restore(saved);draft=null;render();}});
  function toast(text) { const el=$('.mg-message');el.textContent=text;el.hidden=false;clearTimeout(messageTimer);messageTimer=setTimeout(()=>{el.hidden=true;},3200); }
  function go(view) { if(state.testState==='running') {clearInterval(intervalId);state.testState='paused';} state.view=view;draft=null;render();persist(); }
  const packs = () => state.packages.filter(p=>p.sim===state.sim);
  const settings = () => state.cards[state.sim];
  const effectiveUsed = p => p.used+(settings().correction?.pack===p.id?settings().correction.delta:0);
  function generalSummary() { const list=packs().filter(p=>p.kind==='general');return {total:list.length&&list.every(p=>p.total!==null)?list.reduce((n,p)=>n+p.total,0):null,used:list.reduce((n,p)=>n+effectiveUsed(p),0)}; }
  function header() {
    const titles={overview:['流量守卫','双卡流量，一眼有数'],packages:['流量包','每张卡，独立管理额度'],correction:['官方校准','让本地统计跟上官方账单'],protection:['用量保护','额度有边界，用卡有规则'],edit:[state.editorId?'编辑流量包':'新建流量包','卡 '+state.sim+' · 独立配置'],rules:['识别规则','候选规则不等于定向扣费证明'],rule:['规则详情','按官方扣费结果验证适用范围'],apps:['应用用量','只统计当前卡的蜂窝数据'],import:['导入规则','两份配置，合并一次'],capture:['连接官方查询','在手机本地保存登录凭据'],manual:['手动校准','以官方同一账期用量为准'],test:['定向规则验证','离线演示 · 不发起下载'],card:['卡片与账期','槽位用于显示，卡身份用于记账'],diagnostics:['模块状态','功能接入后再显示实际状态']};
    const [title,sub]=titles[state.view];
    const back=!['overview','packages','correction','protection'].includes(state.view);
    $('.mg-header').innerHTML=`<div class="${back?'mg-header-title':''}">${back?`<button type="button" aria-label="返回" class="mg-icon-button cursor-interaction" data-action="back">${icon('arrow-left')}</button>`:''}<div><h1>${esc(title)}</h1><p class="mg-subtitle">${esc(sub)}</p></div></div>${!back?`<button type="button" class="mg-icon-button cursor-interaction" aria-label="卡片与账期设置" data-action="card">${icon('sliders-horizontal')}</button>`:''}`;
    const simViews=['overview','packages','correction','protection','apps'];
    $('.mg-sims').hidden=!simViews.includes(state.view);
    $('.mg-sims').innerHTML=[1,2].map(n=>`<button type="button" class="mg-sim cursor-interaction" data-sim="${n}" aria-pressed="${state.sim===n}"><span class="mg-sim-top">${icon('contact-round')}卡 ${n} ${n===2?badge('数据卡'):''}</span><p class="mg-sim-detail">${esc(state.cards[n].alias!=='卡 '+n?state.cards[n].alias:n===2?'运营商待确认 · 可配置':'无可用流量 · 禁止数据')}</p></button>`).join('');
    const active=({edit:'packages',rules:'packages',rule:'packages',import:'packages',capture:'correction',manual:'correction',test:'protection',apps:'overview',card:'overview',diagnostics:'overview'})[state.view]||state.view;
    $('.mg-nav').innerHTML=[['overview','总览','layout-dashboard'],['packages','流量包','layers'],['correction','校准','refresh-cw'],['protection','保护','shield-check']].map(([v,t,i])=>`<button type="button" class="cursor-interaction" ${v===active?'aria-current="page"':''} data-action="${v}">${icon(i)}<span>${t}</span></button>`).join('');
  }
  function card1Empty() { return `<div class="mg-panel mg-empty">${icon('shield-off')}<h2>卡 1 暂不使用流量</h2><p class="mg-note">禁止作为测试卡和自动切卡目标。<br>套餐仍可独立配置，供以后启用。</p><div class="mg-actions">${btn('配置卡 1 流量包','new','soft')}</div></div>`; }
  function overview() {

    const running=state.testState==='running';
    return `${note('仅演示流程，不产生真实流量。实机仅卡 2，首阶段 1 GB，总授权上限 5 GB。')}<div class="mg-panel"><div class="mg-row"><span>测试卡</span>${badge('仅卡 2')}</div><div class="mg-divider"></div><div class="mg-row"><span>卡 1 数据</span><span class="mg-small">始终禁止</span></div><div class="mg-divider"></div><label class="mg-field">测试资源<select data-setting="testProfile" ${running?'disabled':''}>${ruleSeeds.map(r=>`<option value="${r.id}" ${state.testProfile===r.id?'selected':''}>${r.name} · 待验证</option>`).join('')}</select></label><label class="mg-field">累计停止阈值 / MB<input type="number" min="10" max="4500" step="10" value="${state.testLimit}" data-setting="testLimit" ${running?'disabled':''}></label><p class="mg-note">停止线最高 4500 MB，预留至少 500 MB 缓冲；包括后台蜂窝流量。不是下载完成目标。</p></div>
    <div class="mg-panel"><div class="mg-row"><span>累计测试预算消耗 · 演示</span>${badge(running?'模拟进行中':state.testState==='finished'?'已停止':state.testState==='paused'?'已暂停':'待开始','neutral')}</div><div class="mg-pack-total">${state.testProgress} <small>/ ${state.testLimit} MB</small></div>${meter(state.testProgress,state.testLimit,'模拟测试累计 MB')}<p class="mg-note">${state.testState==='finished'?'达到演示保护线，已自动停止。官方扣费归属仍待核实。':'真实测试前后分别查询官方通用与定向余额，等待账单入账后比较。'}</p></div><div class="mg-actions">${btn(running?'暂停模拟':'模拟运行流程',running?'pause-test':'start-test','primary')}${btn('停止模拟','stop-test')}</div><p class="mg-note">本次用量不会清零。实际测试会从小样本开始，不直接跑满预算。</p>`;
  }
  function appStats() { return `${note('应用统计是分类估算。匹配到多个包时按优先级归属，不重复计费。')}<div class="mg-panel">${(state.sim===2?[['跑满了吗','312 MB','候选规则命中 · 待验证'],['咪咕快游','286 MB','定向包已用尽 · 计入通用'],['移动云盘','128 MB','额度未知 · 计入保护预算'],['其他应用','100 MB','通用 / 未识别']]:[]).map(([a,v,d])=>`<div class="mg-item"><div class="mg-app-icon neutral">${a.slice(0,1)}</div><div class="mg-item-text"><div class="mg-item-name">${a}</div><div class="mg-small">${d}</div></div><div class="mg-value">${v}</div></div>`).join('')||'<p class="mg-small">卡 1 暂无用量记录</p>'}</div><p class="mg-note">统计范围：当前卡 · 今日 · 接收 + 发送。Wi-Fi 不计入。</p>`; }
  function card() { const cfg=settings();return `<form id="mg-card-form"><div class="mg-panel"><h2 style="font-size:16px">卡 ${state.sim}</h2><label class="mg-field" style="margin-top:16px">卡片备注<input name="alias" maxlength="30" value="${esc(cfg.alias)}"></label><label class="mg-field">每月账期起始日<select name="cycle">${Array.from({length:31},(_,i)=>`<option value="${i+1}" ${cfg.cycle===i+1?'selected':''}>每月 ${i+1} 日</option>`).join('')}</select></label><label class="mg-field">运营商计量单位<select name="unit"><option value="decimal" ${cfg.unit!=='binary'?'selected':''}>1 GB = 1000 MB</option><option value="binary" ${cfg.unit==='binary'?'selected':''}>1 GB = 1024 MB</option></select></label><p class="mg-note">当月没有对应日期时，按当月最后一天计算。</p></div>${note('运营商和卡槽的对应关系尚待确认。正式模块换卡后会重新校验身份，避免把旧卡套餐套给新卡。')}<button type="submit" class="mg-button primary wide cursor-interaction">保存卡片设置</button></form>`; }
  function diagnostics() { return `<div class="mg-panel">${[['LSPosed 模块','待开发接入'],['目标 API','libxposed 102'],['按卡读取用量','待实机验证'],['应用与连接规则识别','待实机验证'],['停用数据 / 切换数据卡','待实机验证'],['江苏移动 / 联通查询','等待抓包适配']].map(([n,v])=>`<div class="mg-row" style="padding:12px 0;border-bottom:1px solid var(--mg-line)"><span>${n}</span><span class="mg-small">${v}</span></div>`).join('')}</div><p class="mg-note">不能执行的控制项应明确显示不可用；只有收到执行回执，才显示“已停用”或“已切换”。</p>`; }
  function render() {
    header();
    const views={overview,packages,edit,rules,rule,import:imported,correction,capture,manual,protection,test,apps:appStats,card,diagnostics};
    $('.mg-main').innerHTML=views[state.view]();
    if(state.view==='packages') root.querySelectorAll('.mg-pack').forEach(el=>{const p=state.packages.find(p=>p.id===el.querySelector('[data-edit]').dataset.edit);if(p.scope==='shared'){const line=document.createElement('p');line.className='mg-note';line.textContent='共享额度池 '+p.poolKey+' · '+p.members+' 位成员'+(p.accountAlias?' · '+p.accountAlias:'');el.append(line);}});
    root.querySelectorAll('button').forEach(el=>el.classList.add('cursor-interaction'));
    if(globalThis.lucide) globalThis.lucide.createIcons({attrs:{width:20,height:20}});
  }
  root.addEventListener('click',e=>{
    const el=e.target.closest('button'); if(!el||!root.contains(el)) return;
    if(el.type==='submit') {e.preventDefault();const form=el.closest('form');if(form?.reportValidity())saveForm(form);return;}
    if(el.dataset.sim) {state.sim=Number(el.dataset.sim);if(state.testState==='running'){clearInterval(intervalId);state.testState='paused';}render();persist();return;}
    if(el.dataset.edit) {state.editorId=el.dataset.edit;go('edit');return;}
    if(el.dataset.rule) {state.ruleId=el.dataset.rule;go('rule');return;}
    const a=el.dataset.action;
    if(['overview','packages','correction','protection','rules','import','capture','manual','test','apps','card','diagnostics'].includes(a)) return go(a);
    if(a==='new') {state.editorId=null;return go('edit');}
    if(a==='back') return go(({rule:'rules',capture:'correction',manual:'correction',test:'protection',apps:'overview',card:'overview',diagnostics:'overview'})[state.view]||'packages');
    if(a==='confirm-import') {state.rulesImported=true;go('rules');toast('已保留 5 组候选规则，重复副本已忽略');return;}
    if(a==='sample') {const result=$('#mg-rule-result');result.hidden=false;result.textContent='样例命中这条候选规则：10 MB → 定向估算。验证前，这 10 MB 仍纳入通用保护预算。';return;}
    if(a==='demo-correction') {if(settings().correction){toast('这个示例已校准，不会重复叠加差额');return;}const p=packs().find(p=>p.kind==='general');if(!p)return;settings().correction={pack:p.id,from:p.used,to:p.used+0.36,delta:0.36};render();persist();toast('示例校准：+0.36 GB，原始计数保持不变');return;}
    if(a==='simulate-protection') {const result=$('#mg-protection-result');result.hidden=false;result.textContent=state.policy==='switch'?'预览结果：卡 1 禁止数据，无可用切换目标 → 停止卡 2 移动数据并通知。':state.policy==='fixed'?'预览结果：拒绝切换到卡 1；卡 2 达保护线后 → 停止移动数据并通知。':'预览结果：卡 2 达保护线后 → 停止移动数据并通知。';return;}
    if(a==='start-test') {
      if(state.testProgress>=state.testLimit){toast('累计额度已达保护线，不能继续模拟');return;}
      state.sim=2;state.testState='running';clearInterval(intervalId);render();
      intervalId=setInterval(()=>{state.testProgress=Math.min(state.testLimit,state.testProgress+Math.max(1,Math.round(state.testLimit/12)));if(state.testProgress>=state.testLimit){state.testState='finished';clearInterval(intervalId);persist();}render();},700);return;
    }
    if(a==='pause-test'||a==='stop-test') {clearInterval(intervalId);state.testState=a==='pause-test'?'paused':'finished';render();persist();}
  });
  root.addEventListener('change',e=>{
    const el=e.target;
    if(el.name==='policy') {state.policy=el.value;persist();return;}
    const s=el.dataset.setting;if(!s) return;
    if(['reserve','testLimit'].includes(s)) {const min=s==='reserve'?100:10,max=s==='reserve'?2000:4500;state[s]=Math.max(min,Math.min(max,Number(el.value)||min));el.value=state[s];if(s==='testLimit'&&state.testProgress>=state.testLimit)state.testState='finished';}
    else if(['adapter','interval'].includes(s)) settings()[s]=el.value;
    else state[s]=el.value;
    if(s==='filter'||s==='testLimit'||s==='adapter') render();
    persist();
  });
  function saveForm(form) {
    const fd=new FormData(form);
    if(form.id==='mg-pack-form') {
      const kind=fd.get('kind'),selectedApps=fd.getAll('apps'),selectedRules=fd.getAll('rules'),mode=fd.get('mode');
      const err=$('#mg-form-error');
      if(kind==='directed'&&mode==='both'&&(!selectedApps.length||!selectedRules.length)){err.hidden=false;err.textContent='同时匹配模式至少需要选择 1 个应用和 1 条规则。';return;}
      const scope=fd.get('scope'),poolKey=String(fd.get('poolKey')).trim();
      if(scope==='shared'&&!poolKey){err.hidden=false;err.textContent='共享流量包需要填写共享池标识，以免重复记账。';return;}
      if(scope==='shared'&&state.packages.some(p=>p.id!==draft.id&&p.scope==='shared'&&p.poolKey===poolKey)){err.hidden=false;err.textContent='这个共享池已经存在，请编辑原共享包，避免重复配置额度。';return;}
      const total=fd.get('total')===''?null:Number(fd.get('total'));
      if(total===null&&kind==='general'){err.hidden=false;err.textContent='通用流量需要明确额度，才能设置保护线。';return;}
      const updated={...draft,id:draft.id||'custom-'+Date.now(),name:String(fd.get('name')).trim(),kind,total,used:Number(fd.get('used')),apps:kind==='general'?[]:selectedApps,rules:kind==='general'?[]:selectedRules,mode,period:fd.get('period'),priority:Number(fd.get('priority')),scope,poolKey:scope==='shared'?poolKey:'',accountAlias:String(fd.get('accountAlias')).trim(),members:Number(fd.get('members'))};
      if(!updated.name){err.hidden=false;err.textContent='请填写流量包名称。';return;}
      const index=state.packages.findIndex(p=>p.id===updated.id);if(index>=0)state.packages[index]=updated;else state.packages.push(updated);
      go('packages');toast('流量包已保存 · 仅保存在设计预览中');
    }
    if(form.id==='mg-manual-form') {
      const p=state.packages.find(p=>p.id===fd.get('pack'));if(!p)return;
      const asof=String(fd.get('asof'));
      if(new Date(asof)>new Date()) {const err=$('#mg-manual-error');err.hidden=false;err.textContent='官方统计截至时间不能晚于当前时间。';return;}
      settings().manualCorrection={pack:p.id,used:Number(fd.get('official')),asof};
      // The prototype has no local counter history; keep the current estimate intact.
      go('correction');toast('已保存演示校准快照；接入真实计数后计算时间差额');
    }
    if(form.id==='mg-card-form') {const cfg=settings();cfg.alias=String(fd.get('alias')).trim()||'卡 '+state.sim;cfg.cycle=Number(fd.get('cycle'));cfg.unit=fd.get('unit');go('overview');toast('卡片设置已保存 · 设计预览');}
  }
  root.addEventListener('submit',e=>{e.preventDefault();if(e.target.reportValidity())saveForm(e.target);});
  root.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.tagName==='INPUT'){const form=e.target.closest('form');if(form){e.preventDefault();if(form.reportValidity())saveForm(form);}}});
  render();
  const appearance={radius:22};
  if(globalThis.Tweak) {const tweak=new Tweak({container:$('.mg-phone'),onChange:()=>root.style.setProperty('--mg-radius',appearance.radius+'px')});tweak.addSlider(appearance,'radius',{label:'内容圆角',min:12,max:28,unit:'px'});}
})();
</script>
