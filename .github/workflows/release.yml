name: Android release build

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    if: github.event.created
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: "platforms;android-37.0 build-tools;36.1.0"
      - name: Test, lint and assemble unsigned release
        run: sh ./gradlew :core:test :app:lintRelease :app:assembleRelease -PciUnsignedRelease=true --no-daemon --console=plain
      - name: Check APK version and prepare artifact
        run: |
          apk_dir=app/build/outputs/apk/release
          test "v$(jq -er '.elements[0].versionName' "$apk_dir/output-metadata.json")" = "$GITHUB_REF_NAME"
          test "$(jq -er '.elements[0].outputFile' "$apk_dir/output-metadata.json")" = app-release-unsigned.apk
          mkdir -p dist
          cp "$apk_dir/app-release-unsigned.apk" dist/
          printf '%s\n' "$GITHUB_REF_NAME" > dist/source-tag.txt
          git rev-parse HEAD > dist/source-commit.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: unsigned-release
          path: dist/
          if-no-files-found: error
          retention-days: 7
